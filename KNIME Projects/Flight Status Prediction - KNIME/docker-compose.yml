services:
  sftp: # Source
    image: atmoz/sftp
    container_name: sftp
    hostname: sftp
    platform: linux/amd64
    ports:
      - "2222:22"
    volumes:
      - ./data:/home/knime_user/upload
    environment:
      SFTP_USERS: "knime_user:knime_password:1001"
      SFTP_UID: "1001"
    command: knime_user:knime_password:1001::upload
    restart: unless-stopped
    networks:
      - project_network

  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: delayed_flights_db_pg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d delayed_flights_db_pg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - project_network
    
networks:
  project_network:

volumes:
  pg_data:
  sftp_data: