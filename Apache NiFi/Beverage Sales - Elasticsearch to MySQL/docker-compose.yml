services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: elasticsearch
    environment:
      - NIFI_JVM_OPTS=-Djava.awt.headless=true -XX:+UseContainerSupport -XX:-UseContainerCgroup
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=es_nifi_pass
      # (Optional) Disable SSL for HTTP for testing purposes:
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL -u elastic:es_nifi_pass http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=10s || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - project_network

  data-loader:
    build: ./data-loader
    container_name: data-loader
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./data-loader/data:/data
    networks:
      - project_network
    command: sh -c "python /app/create_index.py && sleep 5 && python /app/bulk_loader.py"

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    restart: always
    command: --local-infile=1
    environment:
      MYSQL_ROOT_PASSWORD: mysql-root-pw
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
      MYSQL_DATABASE: beverage_sales_mysql_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql_scripts:/docker-entrypoint-initdb.d
    networks:
      - project_network

  zookeeper:
    image: bitnami/zookeeper:3.9.2
    hostname: zookeeper
    container_name: zookeeper
    restart: on-failure
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - project_network
    ports:
      - '2181:2181'

  nifi:
    hostname: nifi
    container_name: nifi
    image: apache/nifi:1.27.0
    restart: on-failure
    ports:
      - '8090:8080'
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_CLUSTER_IS_NODE=true
      - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
      - NIFI_ZK_CONNECT_STRING=zookeeper:2181
      - NIFI_ELECTION_MAX_WAIT=30 sec
      - NIFI_SENSITIVE_PROPS_KEY='12345678901234567890A'
      - NIFI_HEAP_INIT=4g
      - NIFI_HEAP_MAX=8g
      - NIFI_JVM_OPTS=-Dnifi.flowfile.repository.block.size=512KB
      - NIFI_JVM_OPTS=-XX:+UseG1GC
      - NIFI_JVM_OPTS=-XX:MaxGCPauseMillis=200
      - NIFI_JVM_OPTS=-XX:ParallelGCThreads=4
      - NIFI_JVM_OPTS=-Dorg.apache.nifi.content.repository.archive.max.retention=8GB \
                      -Dnifi.provenance.repository.max.storage=8GB \
                      -Dnifi.flowfile.repository.rocksdb.block.cache.size=512MB \
                      -Dnifi.flowfile.repository.rocksdb.write.buffer.size=32MB
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nifi-api/system-diagnostics"]
      interval: "15s"
      timeout: "3s"
      start_period: "30s"
      retries: 5
    volumes:
      - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/state:/opt/nifi/nifi-current/state
      - ./nifi/extensions:/opt/nifi/nifi-current/extensions
      - ./jar_files/mysql-connector-j-9.2.0.jar:/opt/nifi/nifi-current/lib/mysql-connector-j-9.2.0.jar
      - ./nifi/conf:/opt/nifi/nifi-current/conf
      - ./nifi/logs:/opt/nifi/nifi-current/logs
    networks:
      - project_network

volumes:
  es_data:
  mysql_data:

networks:
  project_network:
    driver: bridge



# -------------------------------------------------
# Startup notes:

# docker compose up -d

# docker ps -a

# docker cp <docker_container_id>:/opt/nifi/nifi-current/conf ./nifi/

# Uncomment the last line in the nifi volumes after copying the /conf directory 
# from the container to your local directory to persist NiFi flows.

# docker compose up --force-recreate -d

# NiFi: http://localhost:8080/nifi/

# -------------------------------------------------