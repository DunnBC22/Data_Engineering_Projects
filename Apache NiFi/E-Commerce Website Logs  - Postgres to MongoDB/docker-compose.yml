services:
  postgres:
    image: postgres:15
    container_name: postgres
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: ecomm_logs_db_pg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_scripts:/docker-entrypoint-initdb.d
    networks:
      - project_network

  mongodb:
    image: mongo:7.0.17-rc1
    container_name: mongodb
    hostname: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: ecomm_logs_db_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb_scripts:/docker-entrypoint-initdb.d
    networks:
      - project_network

  zookeeper:
    image: bitnami/zookeeper:3.9.2
    hostname: zookeeper
    container_name: zookeeper
    restart: on-failure
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - project_network
    ports:
      - '2181:2181'

  nifi-registry:
    hostname: nifi-registry
    container_name: nifi-registry
    image: 'apache/nifi-registry:1.27.0'
    restart: on-failure
    ports:
      - 18080:18080
    environment:
      - LOG_LEVEL=INFO
      - NIFI_REGISTRY_DB_DIR=/opt/nifi-registry/nifi-registry-current/database
      - NIFI_REGISTRY_FLOW_PROVIDER=file
      - NIFI_REGISTRY_FLOW_STORAGE_DIR=/opt/nifi-registry/nifi-registry-current/flow_storage
    volumes:
      - ./nifi_registry/database:/opt/nifi-registry/nifi-registry-current/database
      - ./nifi_registry/flow_storage:/opt/nifi-registry/nifi-registry-current/flow_storage
    networks:
      - project_network

  nifi:
    hostname: nifi
    container_name: nifi
    image: apache/nifi:1.27.0
    restart: on-failure
    ports:
      - '8090:8080'
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_CLUSTER_IS_NODE=true
      - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
      - NIFI_ZK_CONNECT_STRING=zookeeper:2181
      - NIFI_ELECTION_MAX_WAIT=30 sec
      - NIFI_SENSITIVE_PROPS_KEY='12345678901234567890A'
      - NIFI_HEAP_INIT=4g
      - NIFI_HEAP_MAX=8g
      - NIFI_JVM_OPTS=-Dorg.apache.nifi.content.repository.archive.max.retention=10GB
      - NIFI_JVM_OPTS=-Dnifi.provenance.repository.max.storage=10GB
      - NIFI_JVM_OPTS=-Dnifi.flowfile.repository.rocksdb.block.cache.size=512MB
      - NIFI_JVM_OPTS=-Dnifi.flowfile.repository.rocksdb.write.buffer.size=32MB
    healthcheck:
      test: "${DOCKER_HEALTHCHECK_TEST:-curl localhost:8091/nifi/}"
      interval: "15s"
      timeout: "3s"
      start_period: "5s"
      retries: 5
    volumes:
      - ./nifi/database_repository:/opt/nifi/nifi-current/database_repository
      - ./nifi/flowfile_repository:/opt/nifi/nifi-current/flowfile_repository
      - ./nifi/content_repository:/opt/nifi/nifi-current/content_repository
      - ./nifi/provenance_repository:/opt/nifi/nifi-current/provenance_repository
      - ./nifi/state:/opt/nifi/nifi-current/state
      - ./nifi/extensions:/opt/nifi/nifi-current/extensions
      - ./record_stats:/opt/nifi/output
      
      - ./jar_files/postgresql-42.5.6.jar:/opt/nifi/nifi-current/lib/postgresql-42.5.6.jar
      - ./jar_files/mongodb-driver-sync-4.9.1.jar:/opt/nifi/nifi-current/lib/mongodb-driver-sync-4.9.1.jar
      - ./jar_files/mongodb-driver-core-4.9.1.jar:/opt/nifi/nifi-current/lib/mongodb-driver-core-4.9.1.jar
      - ./jar_files/bson-4.9.1.jar:/opt/nifi/nifi-current/lib/bson-4.9.1.jar
      - ./jar_files/nifi-mongodb-nar-1.27.0.nar:/opt/nifi/nifi-current/lib/nifi-mongodb-nar-1.27.0.nar
      - ./jar_files/nifi-mongodb-services-nar-1.27.0.nar:/opt/nifi/nifi-current/lib/nifi-mongodb-services-nar-1.27.0.nar
      - ./jar_files/nifi-mongodb-client-service-api-nar-1.27.0.nar:/opt/nifi/nifi-current/lib/nifi-mongodb-client-service-api-nar-1.27.0.nar
      
      - ./nifi/conf:/opt/nifi/nifi-current/conf
      - ./nifi/logs:/opt/nifi/nifi-current/logs
    networks:
      - project_network

volumes:
  pg_data:
  mongodb_data:

networks:
  project_network:
    driver: bridge

# -------------------------------------------------
# Startup notes:

# docker compose up -d

# docker ps -a

# docker cp <docker_container_id>:/opt/nifi/nifi-current/conf ./nifi/

# Uncomment the last line in the nifi volumes after copying the /conf directory 
# from the container to your local directory to persist NiFi flows.

# docker compose up --force-recreate -d

# http://localhost:18080/nifi-registry/
# http://localhost:8090/nifi/
# -------------------------------------------------